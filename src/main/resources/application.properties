# ######################################################################################################################
# General server settings
# ######################################################################################################################
server.port=9001
logging.level.Exposed=DEBUG
application.domainName=${SERVER_DOMAIN}
springdoc.swagger-ui.path=/swagger-ui.html
#
# ######################################################################################################################
# Setting up the Database
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.exposed.generate-ddl=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
#
# ######################################################################################################################
# Custom security properties, used to create the user authentication cookies
system.security.enableEncryption=${SERVER_HTTPS}
system.security.password.resetLimitMinutes=15
system.security.jwt.path=/
system.security.jwt.
system.security.jwt.
system.security.jwt.expiration=86400
system.security.jwt.cookieName=USERSESSION
system.security.jwt.issuer=LinceTech
system.security.jwt.secureCookie=${JWT_SECURE_COOKIE}
system.security.jwt.sameSite=None
#
# ######################################################################################################################
# Custom e-mail settings, used to create the user authentication cookies
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT_A}
spring.mail.email=${SMTP_EMAIL}
spring.mail.username=${SMTP_EMAIL}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.port=${SMTP_PORT_B}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
#
# ######################################################################################################################
# The format used for the keystore. It could be set to JKS in case it is a JKS file
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:baeldung.p12
server.ssl.key-store-password=123456789
server.ssl.key-alias=baeldung
server.ssl.enabled=false

