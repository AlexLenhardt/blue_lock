<!DOCTYPE html>
<html lang="en">
<body>
<span>Please, could you prepare this order for us?</span>

<br/>
<br/>

<span th:text="'Destiny: '+${Warehouse.description}"></span>

<br/>
<br/>

<div th:each="packing: ${Packings}">
    <table width="800px" style="border-collapse: collapse">
        <thead>
        <tr style="height: 30px">
            <td style="width:500px; border: 1px solid black; padding-left: 5px"
                th:text="'Packing '+${packing.packing.comex}"></td>
            <td style="width:100px; border: 1px solid black; padding-left: 5px" th:text="'Color'"></td>
            <td style="width:100px; border: 1px solid black; padding-left: 5px" th:text="'Box number'"></td>
            <td style="width:100px; border: 1px solid black; padding-left: 5px" th:text="'Size'"></td>
            <td style="width:100px; border: 1px solid black; padding-left: 5px" th:text="'Weight(lbs)'"></td>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="box : ${packing.boxes}">
            <tr th:each="item : ${box.itens}" style="height: 25px">
                <td style="border: 1px solid black;">&nbsp;
                    <span style="padding-left: 5px"
                          th:text="${item.variant.product.textCode} + ' - ' + ${item.variant.description}">
            </span>
                </td>
                <td style="border: 1px solid black;">&nbsp;
                    <span style="padding-left: 5px" th:text="${item.variant.color.code}"></span>
                </td>
                <td style="border: 1px solid black;">&nbsp;
                    <span style="padding-left: 5px" th:text="${box.number}"></span>
                </td>
                <td style="border: 1px solid black;">&nbsp;
                    <span style="padding-left: 5px"
                          th:text="${box.cubeMeter} != 0.0 ? ${#numbers.formatDecimal(box.cubeMeter, 1, 'COMMA', 2, 'POINT')} : 0"></span>
                </td>
                <td style="border: 1px solid black;">&nbsp;
                    <span style="padding-left: 5px"
                          th:text="${box.grossWeight} != 0.0 ? ${#numbers.formatDecimal(box.grossWeight, 1, 'COMMA', 2, 'POINT')} : 0"></span>
                </td>
            </tr>
        </th:block>
        </tbody>
    </table>
    <br/>
    <br/>
</div>
</body>
</html>
